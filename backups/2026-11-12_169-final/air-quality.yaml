# ESP32-S3-Touch-LCD-1.69 (Waveshare) 空气质量监测 —— ESPHome 版本
# 与 ../src 下的 PlatformIO/Arduino 版本功能等价，二者可分别烧录
#
# 硬件：
#   LCD   ST7789V 240x280 SPI  DC=4 CS=5 CLK=6 MOSI=7 RST=8 BL=15
#   Touch CST816T I2C 0x15     SCL=10 SDA=11 RST=13 INT=14
#   Sensor SCD41  I2C 0x62     （接在扩展口，与触摸共用 I2C 总线）
#   IMU   QMI8658 I2C 0x6B
#   MCU   ESP32-S3R8  16MB Flash / 8MB OPI PSRAM
#
# 界面（按 co2_monitor_ui_v3_5.html 落地）：
#   1. 仪表页：CO2 圆环 + 六级方言分级徽标 + 温湿度
#   2. 趋势页：最近 8 小时，每 30 分钟一根柱（16 根）+ 网格线 + 轴标签
#   设置与校准走覆盖层 / 弹窗，不占主视图。
#
# 交互：拿起或触摸点亮背光，无动作 N 秒自动熄屏（N 可在设置里选）

esphome:
  name: air-quality
  friendly_name: Air Quality Monitor
  on_boot:
    priority: -100
    then:
      # 蜂鸣器使能拉低
      - output.turn_off: buzzer_en
      # 去掉拖动的起始死区（默认 10px），手指一动页面就跟上
      - lambda: |-
          for (lv_indev_t *i = lv_indev_get_next(nullptr); i != nullptr; i = lv_indev_get_next(i)) {
            lv_indev_set_scroll_limit(i, 3);
          }
      # 把持久化的亮度 / 息屏时长 / 阈值同步到界面
      - script.execute: sync_settings_ui
      # 开机点亮，交给熄屏脚本统一管计时
      - script.execute: screen_wake

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  # 240MHz：LVGL 渲染是纯 CPU 活，160MHz 下整屏重绘明显掉帧
  cpu_frequency: 240MHz
  framework:
    type: arduino
    version: 3.3.12

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  # 板载 USB 是 USB-Serial-JTAG，不走 UART0
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "AirQuality Fallback"
    password: "airquality"

captive_portal:

# ---------------- 时间（顶栏时钟 / 趋势轴标签） ----------------
# 没接 RTC 电池，断电后靠 SNTP；没同步到时间时显示 --:--

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Shanghai

# ---------------- 巴法云 MQTT ----------------
# 巴法云：client_id / username / password 都填私钥
# topic_prefix 置空 + discovery 关闭，避免 ESPHome 自动发布到未建主题
mqtt:
  broker: mqtt.bemfa.com
  port: 9501
  username: !secret bemfa_key
  password: !secret bemfa_key
  client_id: !secret bemfa_key
  topic_prefix: "airquality"
  discovery: false
  keepalive: 60s

globals:
  - id: g_co2
    type: float
  - id: g_temp
    type: float
  - id: g_hum
    type: float
  # 当前背光亮度，熄屏后重新点亮时恢复到这个值
  - id: g_bri
    type: float
    restore_value: true
    initial_value: '0.10'
  # 自动息屏秒数，0 = 常亮
  - id: g_sleep_s
    type: uint16_t
    restore_value: true
    initial_value: '30'
  # 通风提醒阈值
  - id: g_threshold
    type: uint16_t
    restore_value: true
    initial_value: '1200'
  # 校准参考浓度
  - id: g_ref_ppm
    type: uint16_t
    initial_value: '1000'
  # 最后一次触摸/运动的时间戳，用于统一计算熄屏超时
  - id: g_active_ms
    type: uint32_t
    initial_value: '0'
  # 最后一次拿到有效 CO2 采样的时间戳（判数据超时）
  - id: g_last_ok_ms
    type: uint32_t
    initial_value: '0'
  # 熄屏前 3 秒是否已经做过渐暗，避免重复触发
  - id: g_dimmed
    type: bool
    initial_value: 'false'

# ---------------- 总线 ----------------

spi:
  clk_pin: GPIO6
  mosi_pin: GPIO7

i2c:
  sda: GPIO11
  scl: GPIO10
  frequency: 400kHz
  scan: true

# ---------------- 背光 ----------------

output:
  - platform: ledc
    pin: GPIO15
    id: bkl_pwm
    frequency: 2000Hz

  # 蜂鸣器使能脚，必须保持低电平，否则无源蜂鸣器持续耗电
  - platform: gpio
    pin: GPIO42
    id: buzzer_en

light:
  - platform: monochromatic
    output: bkl_pwm
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON
    # 关掉 gamma，让 brightness 百分比线性对应 PWM 占空比
    gamma_correct: 1.0

# ---------------- 亮屏 / 熄屏 ----------------
# 拿起（moving 置真）或触摸都调这个脚本：点亮背光，然后每 500ms 检查一次，
# 只要"还在动"或"距上次活动不足 g_sleep_s 秒"就继续亮，否则熄屏。
# g_sleep_s == 0 表示常亮，脚本直接不启动倒计时。
# mode: restart —— 任何新活动都会打断当前等待并重新开始计时。

script:
  - id: screen_wake
    mode: restart
    then:
      - lambda: id(g_dimmed) = false;
      - light.turn_on:
          id: backlight
          brightness: !lambda "return id(g_bri);"
      # g_sleep_s == 0 表示常亮：点亮后直接结束，不启动倒计时
      - if:
          condition:
            lambda: "return id(g_sleep_s) != 0;"
          then:
            - while:
                condition:
                  or:
                    - binary_sensor.is_on: motion_moving
                    - lambda: "return (millis() - id(g_active_ms)) < (uint32_t)id(g_sleep_s) * 1000UL;"
                then:
                  # 熄屏前 3 秒开始渐暗，给一个"要黑了"的预告
                  - if:
                      condition:
                        lambda: |-
                          return !id(g_dimmed) && !id(motion_moving).state &&
                                 id(g_sleep_s) > 4 &&
                                 (millis() - id(g_active_ms)) >= ((uint32_t)id(g_sleep_s) - 3) * 1000UL;
                      then:
                        - lambda: id(g_dimmed) = true;
                        - light.turn_on:
                            id: backlight
                            brightness: 15%
                            transition_length: 2500ms
                  - delay: 500ms
            - light.turn_off: backlight

  # 把持久化的设置同步到界面控件（开机 + 每次修改后调用）
  - id: sync_settings_ui
    then:
      - lambda: |-
          lv_slider_set_value(id(bri_slider), (int)(id(g_bri) * 100.0f), LV_ANIM_OFF);
          {
            char b[8];
            snprintf(b, sizeof(b), "%d%%", (int)(id(g_bri) * 100.0f));
            lv_label_set_text(id(bri_value), b);
          }

          lv_obj_t *sleep_btns[4] = {id(btn_sleep15), id(btn_sleep30), id(btn_sleep60), id(btn_sleep0)};
          const int sleep_vals[4] = {15, 30, 60, 0};
          for (int i = 0; i < 4; i++) {
            bool on = (id(g_sleep_s) == sleep_vals[i]);
            lv_obj_set_style_bg_color(sleep_btns[i], lv_color_hex(on ? 0x1B3A40 : 0x141F27), 0);
            lv_obj_set_style_border_color(sleep_btns[i], lv_color_hex(on ? 0x4F9AA2 : 0x2C3A44), 0);
          }

          lv_obj_t *th_btns[4] = {id(btn_th800), id(btn_th1000), id(btn_th1200), id(btn_th1500)};
          const int th_vals[4] = {800, 1000, 1200, 1500};
          for (int i = 0; i < 4; i++) {
            bool on = (id(g_threshold) == th_vals[i]);
            lv_obj_set_style_bg_color(th_btns[i], lv_color_hex(on ? 0x1B3A40 : 0x141F27), 0);
            lv_obj_set_style_border_color(th_btns[i], lv_color_hex(on ? 0x4F9AA2 : 0x2C3A44), 0);
          }

          {
            char b[16];
            snprintf(b, sizeof(b), "%d ppm", id(g_threshold));
            lv_label_set_text(id(th_value), b);
          }

# ---------------- 显示 ----------------

display:
  - platform: mipi_spi
    id: lcd
    model: ST7789V
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin: GPIO8
    dimensions:
      width: 240
      height: 280
      offset_height: 20
    invert_colors: true
    color_order: BGR
    # 40MHz 时滑动一帧要传 4 次缓冲，明显掉帧；提到 80MHz 后传输耗时减半
    data_rate: 80MHz
    auto_clear_enabled: false
    update_interval: never

# ---------------- 触摸 ----------------

touchscreen:
  - platform: cst816
    id: touch
    address: 0x15
    interrupt_pin: GPIO14
    reset_pin: GPIO13
    # 息屏后碰一下也能点亮；亮着时只续期，不重复调用 turn_on
    on_touch:
      - lambda: id(g_active_ms) = millis();
      - if:
          condition:
            light.is_off: backlight
          then:
            - script.execute: screen_wake

# ---------------- 加速度计：拿起亮屏 ----------------
# QMI8658 挂在同一条 I2C 上（0x6B）。motion 平台的 moving 传感器在检测到
# 加速度/角速度突变时置 true，之后持续 duration 无变化再置 false。
# 这里只用它判断"是否还在动"，熄屏计时交给 screen_wake 脚本。

motion:
  - platform: qmi8658
    id: imu
    address: 0x6B
    # 运动检测需要高频采样，官方建议 ≤100ms
    update_interval: 100ms

binary_sensor:
  - platform: motion
    motion_id: imu
    type: moving
    id: motion_moving
    internal: true
    # moving 判据：相邻采样加速度差 > threshold，或角速度差 > threshold×50。
    # 取 1.0 → 加速度 1.0g / 角速度 50°/s。
    # 实测：静置 <0.035g、环境干扰 w≈16°/s、敲桌子几乎无转动、
    # 拿起时角速度可到 137°/s，所以 50°/s 能把敲桌子和拿起分开。
    threshold: 1.0
    duration: 30s
    on_press:
      - lambda: id(g_active_ms) = millis();
      - script.execute: screen_wake

# ---------------- 传感器 ----------------

sensor:
  - platform: scd4x
    id: scd41
    co2:
      name: "CO2"
      id: co2_sensor
      on_value:
        - lambda: id(g_last_ok_ms) = millis();
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidity"
      id: hum_sensor
    automatic_self_calibration: true
    temperature_offset: 4°C
    update_interval: 5s

# ---------------- 中文字体 ----------------
# 思源黑体（SIL OFL），只打包用到的字符，两个字号
# 注意：glyphs 里出现重复字符会导致校验失败
font:
  - file: "C:/Windows/Fonts/SourceHanSansSC-Medium.ttf"
    id: cn16
    size: 16
    bpp: 4
    glyphs:
      - "仪表趋势模拟得儿°建议通风现在设置×屏幕亮度自动息秒常提醒阈值传感器基线校准手操作达到后示完成已知浓且空气稳定时执行参考环境，可靠取消确认还中闷慌憋不了危！数据超请先勾选下发"
      - " %-.0123456789:COmp"

  - file: "C:/Windows/Fonts/SourceHanSansSC-Medium.ttf"
    id: cn12
    size: 12
    bpp: 4
    glyphs:
      - "仪表趋势模拟得儿°建议通风现在设置×屏幕亮度自动息秒常提醒阈值传感器基线校准手操作达到后示完成已知浓且空气稳定时执行参考环境，可靠取消确认还中闷慌憋不了危！数据超请先勾选下发"
      - " %-.0123456789:COmp"

# ---------------- 界面 ----------------

lvgl:
  displays:
    - lcd
  touchscreens:
    - touch
  color_depth: 16
  buffer_size: 25%
  log_level: WARN
  bg_color: 0x000000
  bg_opa: COVER

  pages:
    # ==================================================================
    # 第 1 页：仪表
    # ==================================================================
    - id: page_main
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # ---- 顶部分段控件 108x36，两段各 52x32 ----
        - obj:
            width: 108
            height: 36
            radius: 11
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x24303A
            pad_all: 2
            scrollable: false
            align: TOP_LEFT
            x: 12
            y: 8
            widgets:
              - obj:
                  width: 52
                  height: 32
                  radius: 8
                  bg_color: 0x24303A
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: LEFT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                  widgets:
                    - label:
                        text: "仪表"
                        text_font: cn12
                        text_color: 0xFFFFFF
                        align: CENTER
              - obj:
                  width: 52
                  height: 32
                  radius: 8
                  bg_color: 0x111A20
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: RIGHT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                    - lvgl.page.show:
                        id: page_trend
                        animation: MOVE_LEFT
                        time: 200ms
                  widgets:
                    - label:
                        text: "趋势"
                        text_font: cn12
                        text_color: 0x9AA9B1
                        align: CENTER

        # ---- 顶栏时钟 ----
        - label:
            id: clock_label
            text: "--:--"
            text_font: montserrat_16
            text_color: 0xD8E1E5
            align: TOP_RIGHT
            x: -60
            y: 16

        # ---- 设置入口 36x36 ----
        - obj:
            id: btn_settings
            width: 36
            height: 36
            radius: 11
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x263440
            pad_all: 0
            scrollable: false
            align: TOP_RIGHT
            x: -12
            y: 8
            on_click:
              - lambda: id(g_active_ms) = millis();
              - lvgl.widget.show: settings_overlay
            widgets:
              - obj: {width: 14, height: 2, radius: 1, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: -5}
              - obj: {width: 14, height: 2, radius: 1, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: 0}
              - obj: {width: 14, height: 2, radius: 1, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: 5}

        # ---- 模拟数据角标 ----
        - label:
            id: sim_badge
            text: "模拟"
            text_font: cn12
            text_color: 0xFF9F0A
            align: TOP_LEFT
            x: 14
            y: 47

        # ---- CO2 圆环 160x160，底部开口 270° ----
        - arc:
            id: co2_arc
            width: 160
            height: 160
            align: TOP_MID
            y: 70
            min_value: 400
            max_value: 2200
            value: 400
            start_angle: 135
            end_angle: 45
            adjustable: false
            arc_width: 14
            arc_color: 0x1E2A31
            arc_rounded: true
            indicator:
              arc_width: 14
              arc_color: 0x37C98A
              arc_rounded: true

        # ---- 环内文字：CO2 / 数值 / ppm / 分级徽标 ----
        - label:
            text: "CO2"
            text_font: montserrat_12
            text_color: 0x9EAFB7
            align: TOP_MID
            y: 93

        - label:
            id: co2_label
            text: "--"
            text_font: montserrat_40
            text_color: 0xF5F8F9
            width: 140
            text_align: CENTER
            align: TOP_MID
            y: 112

        - label:
            text: "ppm"
            text_font: montserrat_12
            text_color: 0x9EAFB7
            align: TOP_MID
            y: 162

        - obj:
            id: status_pill
            width: 48
            height: 24
            radius: 12
            bg_color: 0x18382E
            bg_opa: COVER
            border_width: 1
            border_color: 0x27513F
            pad_all: 0
            scrollable: false
            align: TOP_MID
            y: 183
            widgets:
              - label:
                  id: status_label
                  text: "得儿"
                  text_font: cn16
                  text_color: 0x37C98A
                  align: CENTER

        # ---- 底部温湿度 ----
        - label:
            id: temp_label
            text: "--.-°C"
            text_font: montserrat_18
            text_color: 0xEDF3F5
            align: BOTTOM_LEFT
            x: 14
            y: -12

        - label:
            id: hum_label
            text: "--.-%"
            text_font: montserrat_18
            text_color: 0xEDF3F5
            align: BOTTOM_RIGHT
            x: -14
            y: -12

    # ==================================================================
    # 第 2 页：趋势
    # ==================================================================
    - id: page_trend
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # ---- 顶部分段控件（趋势态）----
        - obj:
            width: 108
            height: 36
            radius: 11
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x24303A
            pad_all: 2
            scrollable: false
            align: TOP_LEFT
            x: 12
            y: 8
            widgets:
              - obj:
                  width: 52
                  height: 32
                  radius: 8
                  bg_color: 0x111A20
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: LEFT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                    - lvgl.page.show:
                        id: page_main
                        animation: MOVE_RIGHT
                        time: 200ms
                  widgets:
                    - label:
                        text: "仪表"
                        text_font: cn12
                        text_color: 0x9AA9B1
                        align: CENTER
              - obj:
                  width: 52
                  height: 32
                  radius: 8
                  bg_color: 0x24303A
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: RIGHT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                  widgets:
                    - label:
                        text: "趋势"
                        text_font: cn12
                        text_color: 0xFFFFFF
                        align: CENTER

        # ---- 顶栏时钟 ----
        - label:
            id: clock_label2
            text: "--:--"
            text_font: montserrat_16
            text_color: 0xD8E1E5
            align: TOP_RIGHT
            x: -60
            y: 16

        # ---- 设置入口（趋势页也要能进）----
        - obj:
            width: 36
            height: 36
            radius: 11
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x263440
            pad_all: 0
            scrollable: false
            align: TOP_RIGHT
            x: -12
            y: 8
            on_click:
              - lambda: id(g_active_ms) = millis();
              - lvgl.widget.show: settings_overlay
            widgets:
              - obj: {width: 14, height: 2, radius: 1, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: -5}
              - obj: {width: 14, height: 2, radius: 1, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: 0}
              - obj: {width: 14, height: 2, radius: 1, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: 5}

        # ---- 当前值 ----
        - label:
            id: trend_value
            text: "--"
            text_font: montserrat_28
            text_color: 0xF0F4F6
            align: TOP_LEFT
            x: 14
            y: 52

        - label:
            text: "ppm"
            text_font: montserrat_12
            text_color: 0xA4B2B9
            align: TOP_LEFT
            x: 68
            y: 64

        # ---- 建议通风徽标（超过阈值才显示）----
        - obj:
            id: trend_state
            width: 80
            height: 24
            radius: 12
            bg_color: 0x18382E
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            hidden: true
            align: TOP_RIGHT
            x: -14
            y: 58
            widgets:
              - label:
                  id: trend_state_label
                  text: "建议通风"
                  text_font: cn16
                  text_color: 0x37C98A
                  align: CENTER

        # ---- 柱状图：214x120，网格线在柱子之下 ----
        - obj:
            width: 214
            height: 120
            bg_color: 0x0C1319
            bg_opa: COVER
            border_width: 1
            border_color: 0x1E2A33
            radius: 8
            pad_all: 0
            scrollable: false
            align: TOP_MID
            y: 108
            widgets:
              - obj: {width: 200, height: 1, bg_color: 0x2B3941, bg_opa: COVER, border_width: 0, radius: 0, pad_all: 0, align: TOP_MID, y: 28}
