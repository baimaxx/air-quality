# ---------------- 数据刷新 ----------------

interval:
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t tick = 0;
          static bool bars_ready = false;
          tick++;

          bool sim = !id(co2_sensor).has_state();
          float co2, temp, hum;

          if (sim) {
            float t = millis() / 1000.0f;
            co2  = 640.0f + 180.0f * sinf(t / 24.0f) + 25.0f * sinf(t / 3.1f);
            temp = 24.5f + 0.6f * sinf(t / 40.0f);
            hum  = 48.0f + 3.0f * sinf(t / 55.0f);
          } else {
            co2  = id(co2_sensor).state;
            temp = id(temp_sensor).state;
            hum  = id(hum_sensor).state;
          }

          lv_color_t c;
          const char *level;
          if (co2 < 800) {
            c = lv_color_hex(0x30D158); level = "优良";
          } else if (co2 < 1200) {
            c = lv_color_hex(0xFFD60A); level = "一般";
          } else if (co2 < 2000) {
            c = lv_color_hex(0xFF9F0A); level = "偏高";
          } else {
            c = lv_color_hex(0xFF453A); level = "污染";
          }

          // ---- 仪表页 ----
          char buf[16];
          snprintf(buf, sizeof(buf), "%.0f", co2);
          lv_label_set_text(id(co2_label), buf);
          lv_arc_set_value(id(co2_arc), (int16_t)co2);
          lv_obj_set_style_arc_color(id(co2_arc), c, LV_PART_INDICATOR);

          lv_label_set_text(id(status_label), level);
          lv_obj_set_style_text_color(id(status_label), c, 0);
          lv_obj_set_style_bg_color(id(status_pill), c, 0);

          snprintf(buf, sizeof(buf), "%.1f°C", temp);
          lv_label_set_text(id(temp_label), buf);
          snprintf(buf, sizeof(buf), "%.1f%%", hum);
          lv_label_set_text(id(hum_label), buf);

          if (sim) {
            lv_obj_clear_flag(id(sim_badge), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(sim_badge), LV_OBJ_FLAG_HIDDEN);
          }

          // ---- 趋势页 ----
          lv_obj_t *bars[16] = {
            id(bar0),  id(bar1),  id(bar2),  id(bar3),
            id(bar4),  id(bar5),  id(bar6),  id(bar7),
            id(bar8),  id(bar9),  id(bar10), id(bar11),
            id(bar12), id(bar13), id(bar14), id(bar15)
          };

          int h = (int)((co2 - 400.0f) * 120.0f / 1800.0f);
          if (h < 4)   h = 4;
          if (h > 120) h = 120;

          if (!bars_ready) {
            // 首帧用当前值铺平，避免一开机是空的
            for (int i = 0; i < 16; i++) {
              lv_obj_set_height(bars[i], h);
              lv_obj_set_style_bg_color(bars[i], c, 0);
            }
            bars_ready = true;
          } else {
            // 模拟模式 30s 一根，真实数据 30min 一根
            uint32_t period = sim ? 30 : 1800;
            if (tick % period == 0) {
              for (int i = 0; i < 15; i++) {
                lv_obj_set_height(bars[i], lv_obj_get_height(bars[i + 1]));
              }
              lv_obj_set_height(bars[15], h);
            }
            for (int i = 0; i < 16; i++) {
              lv_obj_set_style_bg_color(bars[i], c, 0);
            }
          }

          snprintf(buf, sizeof(buf), "%.0f", co2);
          lv_label_set_text(id(trend_value), buf);

          // 缓存最新值，供 MQTT 发布
          id(g_co2)  = co2;
          id(g_temp) = temp;
          id(g_hum)  = hum;

  # 每分钟往巴法云三个主题各推一条
  - interval: 60s
    then:
      - mqtt.publish:
          topic: esp32co2004
          payload: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.0f", id(g_co2));
            return std::string(buf);

      - mqtt.publish:
          topic: esp32temp004
          payload: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", id(g_temp));
            return std::string(buf);

      - mqtt.publish:
          topic: esp32hum004
          payload: !lambda |-
            char buf[16];
            snprintf(buf, sizeof(buf), "%.1f", id(g_hum));
            return std::string(buf);
