# ---------------- 触摸 ----------------
# GT911 的复位脚也在 TCA9554 上；复位期间 INT 拉低决定 I2C 地址为 0x5D。

touchscreen:
  - platform: gt911
    id: touch
    address: 0x5D
    interrupt_pin: GPIO16
    reset_pin:
      pca9554: exio
      number: 1
    # 息屏后碰一下也能点亮；亮着时只续期，不重复调用 turn_on
    on_touch:
      - lambda: id(g_active_ms) = millis();
      - if:
          condition:
            light.is_off: backlight
          then:
            - script.execute: screen_wake

# ---------------- 加速度计：拿起亮屏 ----------------
# QMI8658 挂在同一条 I2C 上（0x6B）。motion 平台的 moving 传感器在检测到
# 加速度/角速度突变时置 true，之后持续 duration 无变化再置 false。
# 这里只用它判断"是否还在动"，熄屏计时交给 screen_wake 脚本。

motion:
  - platform: qmi8658
    id: imu
    address: 0x6B
    # 运动检测需要高频采样，官方建议 ≤100ms
    update_interval: 100ms

binary_sensor:
  - platform: motion
    motion_id: imu
    type: moving
    id: motion_moving
    internal: true
    # moving 判据：相邻采样加速度差 > threshold，或角速度差 > threshold×50。
    # 取 1.0 → 加速度 1.0g / 角速度 50°/s。
    # 实测：静置 <0.035g、环境干扰 w≈16°/s、敲桌子几乎无转动、
    # 拿起时角速度可到 137°/s，所以 50°/s 能把敲桌子和拿起分开。
    threshold: 1.0
    duration: 30s
    on_press:
      - lambda: id(g_active_ms) = millis();
      - script.execute: screen_wake

# ---------------- 传感器 ----------------

sensor:
  - platform: scd4x
    id: scd41
    co2:
      name: "CO2"
      id: co2_sensor
      on_value:
        - lambda: id(g_last_ok_ms) = millis();
    temperature:
      name: "Temperature"
      id: temp_sensor
    humidity:
      name: "Humidity"
      id: hum_sensor
    # 关闭自动基线校准：长期密闭环境下 ASC 会把偏高的读数当基线，越校越漂。
    # 需要校准时走界面里的「手动基线校准」。
    automatic_self_calibration: false
    # 温补：SCD4x 的 offset 是"从原始读数里减掉的量"，4°C 是 ESPHome 给
    # continuous 模式（加热丝常开、自热明显）的默认值。本机跑 single_shot，
    # 每 60 秒才加热 5 秒，自热很小，减 4°C 反而把读数压低了近 4 度
    # （实测原始值 22.9°C，与参考温度计 22.7°C 只差 0.2°C）。
    # 改 0 后温度回到真值，湿度也会跟着一起修正（RH 是按温度算的）。
    # 2026-11-20 与米家温度计同位置对比：offset=0.9 时读数 22.80，米家 23.3，
    # 原始值（offset=0）=23.70 → 真实自热 0.4°C。取 0.4：温度对齐 23.3，
    # 湿度由 41.6 降到 40.5（米家 41.6，差 1 个点，在 ±3% 内）。
    temperature_offset: 0.4°C
    # 单次测量模式：每次轮询才触发一次测量，传感器其余时间完全空闲。
    # 这是唯一能真正做到"60 秒测一次"的模式——low_power_periodic 是硬件固定
    # 30 秒一轮，改不了；periodic 则是 5 秒一轮、加热丝几乎常开。
    measurement_mode: single_shot
    # 每 60 秒触发一次测量（测量本身约 5 秒，读数在轮询后第 5 秒才出）
    update_interval: 60s

# ---------------- 字体 ----------------
# 思源黑体（SIL OFL），只打包用到的字符。
# 2.8 寸 480x640 下按 1.69 寸版本的 1.75 倍左右取字号。
# 注意：glyphs 里出现重复字符会导致校验失败

font:
  - file: "fonts/SourceHanSansSC-Medium.otf"
    id: cn28
    size: 28
    bpp: 4
    glyphs:
      - "仪表趋势模拟清新尚头蒙得儿°建议通风现在设置×屏幕亮度自动息秒常提醒阈值传感器基线校准手操作达到后示完成已知浓且空气稳定时执行参考环境，可靠取消确认还中闷慌憋不了危！数据超请先勾选下发"
      - " %-.0123456789:COmp"

  - file: "fonts/SourceHanSansSC-Medium.otf"
    id: cn22
    size: 22
    bpp: 4
    glyphs:
      - "仪表趋势模拟清新尚头蒙最高平均低得儿°建议通风现在设置×屏幕亮度自动息秒常提醒阈值传感器基线校准手操作达到后示完成已知浓且空气稳定时执行参考环境，可靠取消确认还中闷慌憋不了危！数据超请先勾选下发"
      - " %-.0123456789:COmp"

  # 数字专用（CO2 读数 / 温湿度 / 时钟 / 参考浓度）
  - file: "fonts/SourceHanSansSC-Medium.otf"
    id: num80
    size: 80
    bpp: 4
    glyphs: ["-0123456789.:%°C"]

  - file: "fonts/SourceHanSansSC-Medium.otf"
    id: num56
    size: 56
    bpp: 4
    glyphs: ["-0123456789.:%°C"]

  - file: "fonts/SourceHanSansSC-Medium.otf"
    id: num36
    size: 36
    bpp: 4
    glyphs: ["-0123456789.:%°C"]

  - file: "fonts/SourceHanSansSC-Medium.otf"
    id: num24
    size: 24
    bpp: 4
    # p / m 用于阈值那几行 "1200 ppm"，开头空格也是必需字形
    # f / s 只为临时帧率显示
    glyphs: [" -0123456789.:%°Cpmfs"]

# ---------------- 界面 ----------------

lvgl:
  displays:
    - lcd
  touchscreens:
    - touch
  color_depth: 16
  # 25% ≈ 154KB。试过 50%：flush 一次要往 PSRAM 写 307KB，跟屏幕扫描抢带宽，
  # 表现为卡顿，已退回。
  buffer_size: 25%
  log_level: WARN
  bg_color: 0x000000
  bg_opa: COVER

  pages:
    # ==================================================================
    # 第 1 页：仪表
    # ==================================================================
    - id: page_main
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # ---- 顶部分段控件 216x72，两段各 104x64 ----
        - obj:
            width: 216
            height: 72
            radius: 22
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x24303A
            pad_all: 4
            scrollable: false
            align: TOP_LEFT
            x: 24
            y: 16
            widgets:
              - obj:
                  width: 104
                  height: 64
                  radius: 16
                  bg_color: 0x24303A
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: LEFT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                  widgets:
                    - label:
                        text: "仪表"
                        text_font: cn22
                        text_color: 0xFFFFFF
                        align: CENTER
              - obj:
                  width: 104
                  height: 64
                  radius: 16
                  bg_color: 0x111A20
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: RIGHT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                    - lvgl.page.show:
                        id: page_trend
                    # 立刻重绘，不等 16ms 的刷新定时器（实测省 5~8ms）
                    - lambda: lv_refr_now(NULL);
                  widgets:
                    - label:
                        text: "趋势"
                        text_font: cn22
                        text_color: 0x9AA9B1
                        align: CENTER

        # ---- 顶栏时钟 ----
        - label:
            id: clock_label
            text: "--:--"
            text_font: num36
            text_color: 0xD8E1E5
            align: TOP_RIGHT
            x: -110
            y: 30

        # ---- 设置入口 64x64 ----
        - obj:
            id: btn_settings
            width: 64
            height: 64
            radius: 20
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x263440
            pad_all: 0
            scrollable: false
            align: TOP_RIGHT
            x: -24
            y: 16
            on_click:
              - lambda: id(g_active_ms) = millis();
              - lvgl.widget.show: settings_overlay
            widgets:
              - obj: {width: 24, height: 3, radius: 2, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: -9}
              - obj: {width: 24, height: 3, radius: 2, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: 0}
              - obj: {width: 24, height: 3, radius: 2, bg_color: 0xC0CCD1, bg_opa: COVER, border_width: 0, pad_all: 0, align: CENTER, y: 9}

        # ---- 模拟数据角标 ----
        - label:
            id: sim_badge
            text: "模拟"
            text_font: cn22
            text_color: 0xFF9F0A
            align: TOP_LEFT
            x: 26
            y: 100

        # ---- CO2 圆环 320x320，底部开口 270° ----
        - arc:
            id: co2_arc
            width: 320
            height: 320
            align: TOP_MID
            y: 160
            min_value: 400
            max_value: 2200
            value: 400
            start_angle: 135
            end_angle: 45
            adjustable: false
            arc_width: 28
            arc_color: 0x1E2A31
            arc_rounded: true
            indicator:
              arc_width: 28
              arc_color: 0x37C98A
              arc_rounded: true

        # ---- 环内文字：CO2 / 数值 / ppm / 分级徽标 ----
        - label:
            text: "CO2"
            text_font: cn22
            text_color: 0x9EAFB7
            align: TOP_MID
            y: 206

        - label:
            id: co2_label
            text: "--"
            text_font: num80
            text_color: 0xF5F8F9
            width: 300
            text_align: CENTER
            align: TOP_MID
            y: 244

        - label:
            text: "ppm"
            text_font: cn22
            text_color: 0x9EAFB7
            align: TOP_MID
            y: 348

        - obj:
            id: status_pill
            width: 96
            height: 48
            radius: 24
            bg_color: 0x18382E
            bg_opa: COVER
            border_width: 1
            border_color: 0x27513F
            pad_all: 0
            scrollable: false
            align: TOP_MID
            y: 392
            widgets:
              - label:
                  id: status_label
                  text: "清新"
                  text_font: cn28
                  text_color: 0x37C98A
                  align: CENTER

        # ---- 底部温湿度 ----
        - label:
            id: temp_label
            text: "--.-°C"
            text_font: num36
            text_color: 0xEDF3F5
            align: BOTTOM_LEFT
            x: 28
            y: -24

        - label:
            id: hum_label
            text: "--.-%"
            text_font: num36
            text_color: 0xEDF3F5
            align: BOTTOM_RIGHT
            x: -28
            y: -24

        # ---- 帧率（临时调试，底部正中，删掉这段即可恢复）----
        - label:
            id: fps_label
            text: "-- fps"
            text_font: num24
            text_color: 0x46565F
            align: BOTTOM_MID
            y: -30

    # ==================================================================
    # 第 2 页：趋势
    # ==================================================================
    - id: page_trend
      bg_color: 0x000000
      bg_opa: COVER
      scrollable: false
      widgets:
        # ---- 顶部分段控件（趋势态）----
        - obj:
            width: 216
            height: 72
            radius: 22
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x24303A
            pad_all: 4
            scrollable: false
            align: TOP_LEFT
            x: 24
            y: 16
            widgets:
              - obj:
                  width: 104
                  height: 64
                  radius: 16
                  bg_color: 0x111A20
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: LEFT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                    - lvgl.page.show:
                        id: page_main
                    # 立刻重绘，不等 16ms 的刷新定时器（实测省 5~8ms）
                    - lambda: lv_refr_now(NULL);
                  widgets:
                    - label:
                        text: "仪表"
                        text_font: cn22
                        text_color: 0x9AA9B1
                        align: CENTER
              - obj:
                  width: 104
                  height: 64
                  radius: 16
                  bg_color: 0x24303A
                  bg_opa: COVER
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  align: RIGHT_MID
                  on_click:
                    - lambda: id(g_active_ms) = millis();
                  widgets:
                    - label:
                        text: "趋势"
                        text_font: cn22
                        text_color: 0xFFFFFF
                        align: CENTER

        # ---- 顶栏时钟 ----
        - label:
            id: clock_label2
            text: "--:--"
            text_font: num36
            text_color: 0xD8E1E5
            align: TOP_RIGHT
            x: -110
            y: 30

        # ---- 设置入口（趋势页也要能进）----
        - obj:
            width: 64
            height: 64
            radius: 20
            bg_color: 0x111A20
            bg_opa: COVER
            border_width: 1
            border_color: 0x263440
            pad_all: 0
            scrollable: false
            align: TOP_RIGHT
            x: -24
            y: 16
            on_click:
              - lambda: id(g_active_ms) = millis();
              - lvgl.widget.show: settings_overlay
