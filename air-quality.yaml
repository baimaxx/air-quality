# ESP32-S3-Touch-LCD-2.8B (Waveshare) 空气质量监测 —— ESPHome 版本
#
# 硬件：
#   LCD   ST7701S 480x640 RGB 并口  PCLK=41 DE=40 HSYNC=38 VSYNC=39
#         D0..D15 = 5,45,48,47,21,14,13,12,11,10,9,46,3,8,18,17
#         初始化走 3 线 SPI：SCLK=2 MOSI=1，CS/RST 在 TCA9554 上
#   Touch GT911  I2C 0x5D      SDA=15 SCL=7  INT=16  RST=EXIO2
#   IO    TCA9554 @0x20        EXIO1=LCD_RST EXIO2=TP_RST EXIO3=LCD_CS EXIO8=蜂鸣器
#   Sensor SCD41  I2C 0x62     （接在扩展口，与触摸共用 I2C 总线）
#   IMU   QMI8658 I2C 0x6B
#   BL    GPIO6 (PWM)
#   MCU   ESP32-S3R8  16MB Flash / 8MB OPI PSRAM
#
# 界面（按 co2_monitor_ui_v3_5.html 落地）：
#   1. 仪表页：CO2 圆环 + 六级方言分级徽标 + 温湿度
#   2. 趋势页：最近 8 小时，每 30 分钟一根柱（16 根）+ 网格线 + 轴标签
#   设置与校准走覆盖层 / 弹窗，不占主视图。
#
# 交互：拿起或触摸点亮背光，无动作 N 秒自动熄屏（N 可在设置里选）

esphome:
  name: air-quality
  friendly_name: Air Quality Monitor
  on_boot:
    # 注意：这里必须是 -100，不能提到 800。
    # globals 组件的 setup 优先级是 29，从 NVS 读回旧值就发生在 setup 里。
    # 如果在它之前（priority 800）改 g_boot_log / g_uptime_mark，
    # 随后 globals 的 setup 会把改过的值当成"已保存值"记进 last_checked_value_，
    # 于是 update() 永远判定"没变化"，一条都不会落盘。
    priority: -100
    then:
      # ---- 黑匣子：把本次复位原因追加进历史 ----
      # 条目格式 "复位原因/上次运行秒数"，逗号分隔，最多保留 20 条。
      # 上次运行秒数来自 g_uptime_mark 的心跳（每 5 分钟写一次 NVS），
      # 精度 ±5 分钟；条目里是 0 说明上次运行不足 5 分钟就复位了。
      - lambda: |-
          const int reason = (int) esp_reset_reason();
          const uint32_t last_up = id(g_uptime_mark);
          std::string h = id(g_boot_log);
          char ent[24];
          snprintf(ent, sizeof(ent), "%d/%u", reason, (unsigned) last_up);
          if (!h.empty()) h += ",";
          h += ent;
          // 只保留最近 20 条，超出从头部截掉
          int n = 1;
          for (char c : h) if (c == ',') n++;
          while (n > 20) {
            size_t p = h.find(',');
            if (p == std::string::npos) break;
            h.erase(0, p + 1);
            n--;
          }
          id(g_boot_log) = h;
          id(g_uptime_mark) = 0;
          ESP_LOGI("blackbox", "reset_reason=%d last_uptime=%us hist=%s", reason, (unsigned) last_up, h.c_str());
      # 本次复位原因：1 上电 / 3 软件重启 / 4 崩溃 / 6 任务看门狗 / 9 供电掉压
      - lambda: |-
          const char *r = "UNKNOWN";
          switch (esp_reset_reason()) {
            case ESP_RST_POWERON:    r = "POWERON"; break;
            case ESP_RST_EXT:        r = "EXT_PIN"; break;
            case ESP_RST_SW:         r = "SW_RESTART"; break;
            case ESP_RST_PANIC:      r = "PANIC"; break;
            case ESP_RST_INT_WDT:    r = "INT_WDT"; break;
            case ESP_RST_TASK_WDT:   r = "TASK_WDT"; break;
            case ESP_RST_WDT:        r = "RTC_WDT"; break;
            case ESP_RST_DEEPSLEEP:  r = "DEEPSLEEP"; break;
            case ESP_RST_BROWNOUT:   r = "BROWNOUT"; break;
            case ESP_RST_SDIO:       r = "SDIO"; break;
            case ESP_RST_USB:        r = "USB"; break;
            case ESP_RST_JTAG:       r = "JTAG"; break;
            case ESP_RST_EFUSE:      r = "EFUSE"; break;
            case ESP_RST_PWR_GLITCH: r = "PWR_GLITCH"; break;
            case ESP_RST_CPU_LOCKUP: r = "CPU_LOCKUP"; break;
            default: break;
          }
          ESP_LOGI("boot", "reset_reason=%d (%s)", (int)esp_reset_reason(), r);
      # 蜂鸣器使能拉低
      - output.turn_off: buzzer_en
      # 去掉拖动的起始死区（默认 10px），手指一动页面就跟上
      - lambda: |-
          for (lv_indev_t *i = lv_indev_get_next(nullptr); i != nullptr; i = lv_indev_get_next(i)) {
            lv_indev_set_scroll_limit(i, 3);
          }
      # 把持久化的亮度 / 息屏时长 / 阈值同步到界面
      - script.execute: sync_settings_ui
      # 开机点亮，交给熄屏脚本统一管计时
      - script.execute: screen_wake
      # 单次测量模式下，第一次读数本来要等 60 秒的轮询。
      # 这里开机后主动触发一次测量，让第一屏真实数据在 13 秒左右出来
      # （8 秒等待：setup() 结束时已经自动发起过一次测量，约 2~7 秒，
      #  提前触发会撞上正在进行的测量被 NACK）
      - delay: 8s
      - component.update: scd41

# 本地覆盖的 st7701s 组件。相对内置版改了三处：
#   1. loop() 不再每轮 restart，避免周期性打断 RGB DMA 导致画面上下跳动
#   2. bounce buffer 20 行（内置 10 行），减少 PSRAM 读取的碎块
#   3. 新增 update_pclk_frequency()，供熄屏时降低面板扫描频率
# 放本地是为了升级 ESPHome 不被覆盖。
external_components:
  - source:
      type: local
      path: components
    components: [st7701s]

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  # 240MHz：LVGL 渲染是纯 CPU 活，160MHz 下整屏重绘明显掉帧
  cpu_frequency: 240MHz
  framework:
    type: arduino
    version: 3.3.12

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO
  # 板载 USB 是 USB-Serial-JTAG，不走 UART0
  hardware_uart: USB_SERIAL_JTAG

api:
  # 没有 HA / esphome logs 客户端连上来时不要自动重启。
  # 默认 15min 会在无客户端时周期重启，表现为屏幕自己亮起并回到「模拟」状态。
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # 省电大头：射频在两次 AP beacon 之间休眠。默认 NONE 时 WiFi 一直满功率待机，
  # 实测这一项能省 40~60mA。代价只是下行延迟多 ~100ms，本设备只上报不收命令，无感。
  power_save_mode: LIGHT
  # 开机跳过全信道扫描，直连已存 SSID，省掉几秒的搜网高功率
  fast_connect: true
  ap:
    ssid: "AirQuality Fallback"
    password: "airquality"

captive_portal:

# ---------------- 网页看数据 ----------------
# local: true 把前端内嵌进固件（v3 约 78KB），不依赖 oi.esphome.io CDN，国内也能打开。
# 注意：浏览器开着页面时会持续轮询，WiFi 一直醒着，会吃掉 LIGHT sleep 的省电收益。
# 与 captive_portal 共用同一个 web_server_base，不冲突。
web_server:
  port: 80
  version: 3
  local: true

# ---------------- 时间（顶栏时钟 / 趋势轴标签） ----------------
# 没接 RTC 电池，断电后靠 SNTP；没同步到时间时显示 --:--

time:
  - platform: sntp
    id: sntp_time
    timezone: Asia/Shanghai

# ---------------- 巴法云 MQTT ----------------
# 巴法云：client_id / username / password 都填私钥
# topic_prefix 置空 + discovery 关闭，避免 ESPHome 自动发布到未建主题
mqtt:
  broker: mqtt.bemfa.com
  port: 9501
  username: !secret bemfa_key
  password: !secret bemfa_key
  client_id: !secret bemfa_key
  topic_prefix: "airquality"
  discovery: false
  # keepalive 拉长到 120s：心跳包少了，射频唤醒次数跟着少
  keepalive: 120s
  # 每次连上巴法云都把本次复位原因发一条：
  # 1 上电 / 3 软件重启 / 4 崩溃 / 5 中断看门狗 / 6 任务看门狗 / 9 供电掉压 / 11 USB
  on_connect:
    - lambda: |-
        ESP_LOGI("boot", "mqtt on_connect: reset_reason=%d", (int)esp_reset_reason());
    - mqtt.publish:
        topic: esp32reset
        payload: !lambda |-
          char buf[8];
          snprintf(buf, sizeof(buf), "%d", (int)esp_reset_reason());
          return std::string(buf);
        retain: true
    # 黑匣子全量历史，连上就推一次（保留消息，随时能读）
    - mqtt.publish:
        topic: esp32boot
        payload: !lambda 'return id(g_boot_log);'
        retain: true

globals:
  - id: g_co2
    type: float
  # 黑匣子：复位历史，"复位原因/上次运行秒数" 逗号分隔，最多 20 条。
  # 默认容量只有 64 字节（含 1 字节长度前缀），20 条会写到一半就静默丢弃，
  # 所以必须显式放大。254 是 schema 允许的最大值（实际分配 255 字节）。
  - id: g_boot_log
    type: std::string
    restore_value: true
    max_restore_data_length: 254
    initial_value: '""'
  # 心跳：每 5 分钟把当前运行秒数写进 NVS，重启后据此推算上次跑了多久
  - id: g_uptime_mark
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: g_temp
    type: float
  - id: g_hum
    type: float
  # 当前背光亮度，熄屏后重新点亮时恢复到这个值
  - id: g_bri
    type: float
    restore_value: true
    initial_value: '0.10'
  # 自动息屏秒数，0 = 常亮
  - id: g_sleep_s
    type: uint16_t
    restore_value: true
    initial_value: '30'
  # 通风提醒阈值
  - id: g_threshold
    type: uint16_t
    restore_value: true
    initial_value: '1200'
  # 校准参考浓度
  - id: g_ref_ppm
    type: uint16_t
    initial_value: '1000'
  # 最后一次触摸/运动的时间戳，用于统一计算熄屏超时
  - id: g_active_ms
    type: uint32_t
    initial_value: '0'
  # 最后一次拿到有效 CO2 采样的时间戳（判数据超时）
  - id: g_last_ok_ms
    type: uint32_t
    initial_value: '0'
  # 熄屏前 3 秒是否已经做过渐暗，避免重复触发
  - id: g_dimmed
    type: bool
    initial_value: 'false'
  # 当前是否处于熄屏省电状态（CPU 降频 + LVGL 暂停 + 界面不刷新）
  - id: g_asleep
    type: bool
    initial_value: 'false'
  # 强制下一次刷新界面。熄屏期间界面是冻结的，唤醒后必须无条件重画一次，
  # 否则数值没变时会一直显示熄屏前的旧内容。
  - id: g_ui_force
    type: bool
    initial_value: 'true'
  # 趋势历史：16 个 30 分钟格，逗号分隔存成字符串写进 NVS（断电重启接着画）
  # 空槽用 nan 表示，统计和柱子都会跳过
  - id: g_hist_str
    type: std::string
    restore_value: true
    max_restore_data_length: 200
    initial_value: '""'
  # 最后一格写入时的 Unix 时间戳，用来算关机期间空了几格
  - id: g_hist_epoch
    type: uint32_t
    restore_value: true
    initial_value: '0'

# ---------------- 总线 ----------------

spi:
  clk_pin: GPIO2
  mosi_pin: GPIO1

i2c:
  sda: GPIO15
  scl: GPIO7
  # 传感器已焊接，回到标准 400kHz
  frequency: 400kHz
  scan: true

# ---------------- IO 扩展 TCA9554 ----------------
# 屏幕复位 / 触摸复位 / 屏幕片选 / 蜂鸣器使能都挂在这颗扩展芯片上
pca9554:
  - id: exio
    address: 0x20

# ---------------- 背光 ----------------

output:
  - platform: ledc
    pin: GPIO6
    id: bkl_pwm
    # 20kHz 避开人耳可闻频段
    frequency: 20000Hz

  # 蜂鸣器使能脚（EXIO8），必须保持低电平，否则无源蜂鸣器持续耗电
  - platform: gpio
    pin:
      pca9554: exio
      number: 7
    id: buzzer_en

light:
  - platform: monochromatic
    output: bkl_pwm
    id: backlight
    name: "Backlight"
    restore_mode: ALWAYS_ON
    # 关掉 gamma，让 brightness 百分比线性对应 PWM 占空比
    gamma_correct: 1.0

# ---------------- 亮屏 / 熄屏 ----------------
# 拿起（moving 置真）或触摸都调这个脚本：点亮背光，然后每 500ms 检查一次，
# 只要"还在动"或"距上次活动不足 g_sleep_s 秒"就继续亮，否则熄屏。
# g_sleep_s == 0 表示常亮，脚本直接不启动倒计时。
# mode: restart —— 任何新活动都会打断当前等待并重新开始计时。

script:
  - id: screen_wake
    mode: restart
    then:
      - lambda: id(g_dimmed) = false;
      # 只在真正从熄屏状态唤醒时才恢复主频并继续渲染。
      # 亮屏期间每次触摸/运动都会 restart 本脚本，若无条件 resume，
      # 每次触摸都会整屏 invalidate 重绘一遍，反而更费电。
      - if:
          condition:
            lambda: "return id(g_asleep);"
          then:
            - lambda: |-
                id(g_asleep) = false;
                id(g_ui_force) = true;
                // 先把扫描频率和主频拉回来，再恢复渲染和背光，唤醒瞬间才不闪
                id(lcd)->update_pclk_frequency(12000000);
                setCpuFrequencyMhz(240);
            - lvgl.resume:
      - light.turn_on:
          id: backlight
          brightness: !lambda "return id(g_bri);"
      # g_sleep_s == 0 表示常亮：点亮后直接结束，不启动倒计时
      - if:
          condition:
            lambda: "return id(g_sleep_s) != 0;"
          then:
            - while:
                condition:
                  or:
                    - binary_sensor.is_on: motion_moving
                    - lambda: "return (millis() - id(g_active_ms)) < (uint32_t)id(g_sleep_s) * 1000UL;"
                then:
                  # 熄屏前 3 秒开始渐暗，给一个"要黑了"的预告
                  - if:
                      condition:
                        lambda: |-
                          return !id(g_dimmed) && !id(motion_moving).state &&
                                 id(g_sleep_s) > 4 &&
                                 (millis() - id(g_active_ms)) >= ((uint32_t)id(g_sleep_s) - 3) * 1000UL;
                      then:
                        - lambda: id(g_dimmed) = true;
                        - light.turn_on:
                            id: backlight
                            brightness: 15%
                            transition_length: 2500ms
                  - delay: 500ms
            - light.turn_off:
                id: backlight
                transition_length: 500ms
            # 等背光真正黑掉再动面板，否则降频瞬间的重启会被看到
            - delay: 600ms
            # 熄屏后的省电四连：CPU 240→80MHz、PCLK 12→6MHz、暂停 LVGL 渲染。
            # 面板扫描是硬件行为停不掉，但 12MHz 时它每秒要从 PSRAM 读 17MB，
            # 降到 6MHz 减半（8.6MB/s），这部分是熄屏后唯一的持续功耗。
            - lambda: |-
                id(g_asleep) = true;
                setCpuFrequencyMhz(80);
                id(lcd)->update_pclk_frequency(6000000);
            - lvgl.pause:

  # 把持久化的设置同步到界面控件（开机 + 每次修改后调用）
  - id: sync_settings_ui
    then:
      - lambda: |-
          lv_slider_set_value(id(bri_slider), (int)(id(g_bri) * 100.0f), LV_ANIM_OFF);
          {
            char b[8];
            snprintf(b, sizeof(b), "%d%%", (int)(id(g_bri) * 100.0f));
            lv_label_set_text(id(bri_value), b);
          }

          lv_obj_t *sleep_btns[4] = {id(btn_sleep15), id(btn_sleep30), id(btn_sleep60), id(btn_sleep0)};
          const int sleep_vals[4] = {15, 30, 60, 0};
          for (int i = 0; i < 4; i++) {
            bool on = (id(g_sleep_s) == sleep_vals[i]);
            lv_obj_set_style_bg_color(sleep_btns[i], lv_color_hex(on ? 0x1B3A40 : 0x141F27), 0);
            lv_obj_set_style_border_color(sleep_btns[i], lv_color_hex(on ? 0x4F9AA2 : 0x2C3A44), 0);
          }

          lv_obj_t *th_btns[4] = {id(btn_th800), id(btn_th1000), id(btn_th1200), id(btn_th1500)};
          const int th_vals[4] = {800, 1000, 1200, 1500};
          for (int i = 0; i < 4; i++) {
            bool on = (id(g_threshold) == th_vals[i]);
            lv_obj_set_style_bg_color(th_btns[i], lv_color_hex(on ? 0x1B3A40 : 0x141F27), 0);
            lv_obj_set_style_border_color(th_btns[i], lv_color_hex(on ? 0x4F9AA2 : 0x2C3A44), 0);
          }

          {
            char b[16];
            snprintf(b, sizeof(b), "%d ppm", id(g_threshold));
            lv_label_set_text(id(th_value), b);
          }

# ---------------- 显示 ----------------
# 480x640 RGB565 并口屏。RGB 扫描会持续占用 PSRAM 带宽，PCLK 先压到 20MHz，
# 一帧约 47Hz，既能跑满刷新又给 CPU 留出取指/绘制的余量。

display:
  - platform: st7701s
    id: lcd
    # 初始化命令走 3 线 SPI，CS / RST 在 TCA9554 上
    cs_pin:
      pca9554: exio
      number: 2
    reset_pin:
      pca9554: exio
      number: 0
    data_rate: 10MHz
    dimensions:
      width: 480
      height: 640
    # IDF 的 RGB565 映射：DATA15..11 = R4..R0，DATA10..5 = G5..G0，DATA4..0 = B4..B0
    data_pins:
      red: [46, 3, 8, 18, 17]
      green: [14, 13, 12, 11, 10, 9]
      blue: [5, 45, 48, 47, 21]
    hsync_pin: GPIO38
    vsync_pin: GPIO39
    de_pin: GPIO40
    pclk_pin: GPIO41
    hsync_pulse_width: 10
    hsync_back_porch: 70
    hsync_front_porch: 60
    vsync_pulse_width: 10
    vsync_back_porch: 20
    vsync_front_porch: 20
    # 12MHz → 28Hz。2026-11-20 试过 20MHz（47Hz）：画面撕裂+卡顿，退回。
    # 原因见 st7701s.cpp：num_fbs=1，只有一块在 PSRAM 里的帧缓冲，屏幕扫描和
    # LVGL 写入是同一块内存，没有 vsync 同步 → 刷新率越高、写入越频繁，
    # 撕裂越明显；同时扫描带宽翻倍后 CPU 画图抢不到 PSRAM 带宽，反而更卡。
    pclk_frequency: 12MHz
    # 上升沿采样
    pclk_inverted: false
    color_order: BGR
    auto_clear_enabled: false
    update_interval: never
    # 官方 Demo 的 ST7701S 初始化表（2.8 寸 480x640 专用）
    init_sequence:
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x13]
      - [0xEF, 0x08]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x10]
      - [0xC0, 0x4F, 0x00]
      - [0xC1, 0x10, 0x02]
      - [0xC2, 0x07, 0x02]
      - [0xCC, 0x10]
      - [0xB0, 0x00, 0x10, 0x17, 0x0D, 0x11, 0x06, 0x05, 0x08, 0x07, 0x1F, 0x04, 0x11, 0x0E, 0x29, 0x30, 0x1F]
      - [0xB1, 0x00, 0x0D, 0x14, 0x0E, 0x11, 0x06, 0x04, 0x08, 0x08, 0x20, 0x05, 0x13, 0x13, 0x26, 0x30, 0x1F]
      - [0xFF, 0x77, 0x01, 0x00, 0x00, 0x11]
      - [0xB0, 0x65]
      - [0xB1, 0x71]
      - [0xB2, 0x82]
      - [0xB3, 0x80]
      - [0xB5, 0x42]
      - [0xB7, 0x85]
      - [0xB8, 0x20]
      - [0xC0, 0x09]
      - [0xC1, 0x78]
