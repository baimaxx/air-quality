# ---------------- 数据刷新 ----------------

interval:
  # 黑匣子心跳：把运行秒数写进 NVS（值变化时 globals 自动落盘）。
  # 5 分钟一次，重启后 g_uptime_mark 的值就是上次跑到的大致时刻。
  - interval: 5min
    then:
      - lambda: id(g_uptime_mark) = (uint32_t) (millis() / 1000);
  - interval: 1s
    then:
      - lambda: |-
          static uint32_t tick = 0;
          static bool bars_ready = false;
          static float hist[16] = {0};
          tick++;

          // ---- 帧率（临时调试，删掉这段和 fps_label 即可恢复）----
          // LVGL 每真正画完一帧触发一次 RENDER_READY，比数 loop 次数准
          static uint32_t fps_frames = 0;
          static uint32_t fps_last = 0;
          static bool fps_hooked = false;
          if (!fps_hooked) {
            fps_hooked = true;
            lv_display_add_event_cb(lv_display_get_default(),
                                    +[](lv_event_t *) { fps_frames++; },
                                    LV_EVENT_RENDER_READY, nullptr);
          }
          uint32_t fps_now = millis();
          if (fps_last && fps_now > fps_last) {
            uint32_t f = fps_frames;
            fps_frames = 0;
            lv_label_set_text_fmt(id(fps_label), "%u fps",
                                  (unsigned)(f * 1000 / (fps_now - fps_last)));
          }
          fps_last = fps_now;

          // ---- 四级分级（边界：<800 清新 / 800~1000 尚可 /
          //      1000~2000 通风 / >2000 头蒙），圆环、徽标、柱子共用 ----
          auto level_of = [](float v, lv_color_t *c, lv_color_t *bg,
                             lv_color_t *bd, const char **name) {
            if (v < 800.0f) {
              *c = lv_color_hex(0x37C98A); *bg = lv_color_hex(0x18382E);
              *bd = lv_color_hex(0x27513F); *name = "清新";
            } else if (v <= 1000.0f) {
              *c = lv_color_hex(0xA8C95C); *bg = lv_color_hex(0x303B20);
              *bd = lv_color_hex(0x566632); *name = "尚可";
            } else if (v <= 2000.0f) {
              *c = lv_color_hex(0xEE9650); *bg = lv_color_hex(0x3D2C20);
              *bd = lv_color_hex(0x65432B); *name = "通风";
            } else {
              *c = lv_color_hex(0xF06455); *bg = lv_color_hex(0x41262A);
              *bd = lv_color_hex(0x713C40); *name = "头蒙";
            }
          };

          bool sim = !id(co2_sensor).has_state();
          float co2, temp, hum;

          if (sim) {
            float t = millis() / 1000.0f;
            co2  = 640.0f + 180.0f * sinf(t / 24.0f) + 25.0f * sinf(t / 3.1f);
            temp = 24.5f + 0.6f * sinf(t / 40.0f);
            hum  = 48.0f + 3.0f * sinf(t / 55.0f);
          } else {
            co2  = id(co2_sensor).state;
            temp = id(temp_sensor).state;
            hum  = id(hum_sensor).state;
          }

          // 缓存最新值，供 MQTT 发布
          id(g_co2)  = co2;
          id(g_temp) = temp;
          id(g_hum)  = hum;

          // ---- 趋势历史：从 NVS 恢复 ----
          // 空槽记成 NaN，表示"这段时间没有数据"，不能拿当前值冒充
          static bool hist_loaded = false;
          static bool gap_fixed = false;
          if (!hist_loaded) {
            hist_loaded = true;
            for (int i = 0; i < 16; i++) hist[i] = NAN;
            const std::string &s = id(g_hist_str);
            int idx = 0;
            size_t pos = 0;
            while (pos < s.size() && idx < 16) {
              size_t comma = s.find(',', pos);
              if (comma == std::string::npos) comma = s.size();
              hist[idx++] = strtof(s.substr(pos, comma - pos).c_str(), nullptr);
              pos = comma + 1;
            }
            bool any = false;
            for (int i = 0; i < 16; i++)
              if (!std::isnan(hist[i])) any = true;
            // 全新设备没有历史：把当前值放进最新一格，别让图表空半小时。
            // 但 sim 时当前值是正弦波演示值，不能拿它当第一格。
            if (!any && !sim) hist[15] = co2;
          }

          // ---- 关机期间空掉的格子：等时间同步后补一次 ----
          if (!gap_fixed) {
            auto t = id(sntp_time).now();
            if (t.is_valid()) {
              gap_fixed = true;
              uint32_t now_e = (uint32_t)t.timestamp;
              if (id(g_hist_epoch) > 0 && now_e > id(g_hist_epoch)) {
                uint32_t gap = (now_e - id(g_hist_epoch)) / 1800;
                if (gap >= 16) {
                  for (int i = 0; i < 16; i++) hist[i] = NAN;
                  if (!sim) hist[15] = co2;
                } else if (gap > 0) {
                  for (int i = 0; i + gap < 16; i++) hist[i] = hist[i + gap];
                  for (int i = 16 - gap; i < 16; i++) hist[i] = NAN;
                }
              }
            }
          }

          // ---- 趋势历史 ----
          // 必须放在熄屏早退之前：历史柱是按时间片推进的，睡一晚不推进图表就断了
          lv_obj_t *bars[16] = {
            id(bar0),  id(bar1),  id(bar2),  id(bar3),
            id(bar4),  id(bar5),  id(bar6),  id(bar7),
            id(bar8),  id(bar9),  id(bar10), id(bar11),
            id(bar12), id(bar13), id(bar14), id(bar15)
          };

          if (!bars_ready) {
            // 首格在上面恢复/播种时已经放好，这里只标记已初始化
            bars_ready = true;
          } else {
            // 只有真实数据才推进历史：模拟值是演示用的，写进 NVS 会把趋势弄脏
            if (!sim && tick % 1800 == 0) {
              for (int i = 0; i < 15; i++) hist[i] = hist[i + 1];
              hist[15] = co2;

              // 落盘：16 个值拼成逗号分隔字符串，交给 globals 写 NVS
              std::string sv;
              for (int i = 0; i < 16; i++) {
                if (i) sv += ',';
                if (std::isnan(hist[i])) {
                  sv += "nan";
                } else {
                  char b[12];
                  snprintf(b, sizeof(b), "%.0f", hist[i]);
                  sv += b;
                }
              }
              id(g_hist_str) = sv;
              auto nt = id(sntp_time).now();
              if (nt.is_valid()) id(g_hist_epoch) = (uint32_t)nt.timestamp;

              // 历史整体左移了，柱状图必须重画一次；否则 CO2 数值没变时
              // 会被下面的"值没变就跳过"判断挡住，柱子停在旧形状
              id(g_ui_force) = true;
            }
          }

          // 熄屏期间到此为止：只维护数据缓存和趋势历史，一个 LVGL 调用都不做。
          // 否则每秒都会 invalidate 一次，LVGL 白白重绘 + 往 PSRAM 搬 614KB。
          if (id(g_asleep)) return;

          // 数据超时：传感器 60 秒一个样本，超过 180 秒（3 个周期）才算断
          bool stale = !sim && id(g_last_ok_ms) != 0 &&
                       (millis() - id(g_last_ok_ms)) > 180000UL;

          lv_color_t c, bg, bd;
          const char *level;
          level_of(co2, &c, &bg, &bd, &level);

          lv_color_t gray = lv_color_hex(0x78848A);

          // ---- 顶栏时钟 / 趋势轴起点（每分钟更新一次）----
          // 时钟放在"脏值判断"之前，因为它自己按分钟去重，和传感器数值无关
          static uint32_t last_min = 0xFFFFFFFF;
          auto now = id(sntp_time).now();
          uint32_t cur_min = now.is_valid()
                                 ? (uint32_t)now.hour * 60 + now.minute
                                 : 0xFFFFFFFF;
          if (cur_min != last_min) {
            char tb[8];
            if (now.is_valid()) {
              snprintf(tb, sizeof(tb), "%02d:%02d", now.hour, now.minute);
              lv_label_set_text(id(clock_label), tb);
              lv_label_set_text(id(clock_label2), tb);
              uint32_t sm = (cur_min + 1440 - 480) % 1440;
              snprintf(tb, sizeof(tb), "%02d:%02d", (int)(sm / 60), (int)(sm % 60));
              lv_label_set_text(id(axis_start), tb);
            } else {
              lv_label_set_text(id(clock_label), "--:--");
              lv_label_set_text(id(clock_label2), "--:--");
              lv_label_set_text(id(axis_start), "--:--");
            }
            last_min = cur_min;
          }

          // ---- 只在数值真的变了才动界面 ----
          // LVGL 的 set_style_* / set_width / set_height 每次调用都会 invalidate，
          // 即使值没变也会重绘。1 秒一次无条件刷新 = 每秒白搬一次几百 KB 的 PSRAM。
          static int  last_co2i = -1, last_tempi = -1, last_humi = -1;
          static bool last_stale = false, last_sim = false;
          int co2i = (int)(co2 + 0.5f);
          int tempi = (int)(temp * 10.0f);
          int humi = (int)(hum + 0.5f);
          if (!id(g_ui_force) &&
              co2i == last_co2i && tempi == last_tempi && humi == last_humi &&
              stale == last_stale && sim == last_sim) {
            return;
          }
          id(g_ui_force) = false;
          last_co2i = co2i; last_tempi = tempi; last_humi = humi;
          last_stale = stale; last_sim = sim;

          // ---- 仪表页 ----
          char buf[24];
          snprintf(buf, sizeof(buf), "%.0f", co2);
          lv_label_set_text(id(co2_label), buf);
          lv_arc_set_value(id(co2_arc), (int16_t)co2);
          lv_obj_set_style_arc_color(id(co2_arc), stale ? gray : c, LV_PART_INDICATOR);
          lv_obj_set_style_text_color(id(co2_label),
                                      lv_color_hex(stale ? 0x9AA5AA : 0xF5F8F9), 0);

          if (stale) {
            lv_label_set_text(id(status_label), "数据超时");
            lv_obj_set_style_text_color(id(status_label), lv_color_hex(0xE5C36C), 0);
            lv_obj_set_style_bg_color(id(status_pill), lv_color_hex(0x3D3422), 0);
            lv_obj_set_style_border_color(id(status_pill), lv_color_hex(0x67542B), 0);
            lv_obj_set_width(id(status_pill), 140);
          } else {
            lv_label_set_text(id(status_label), level);
            lv_obj_set_style_text_color(id(status_label), c, 0);
            lv_obj_set_style_bg_color(id(status_pill), bg, 0);
            lv_obj_set_style_border_color(id(status_pill), bd, 0);
            // 徽标宽度按"字符数"算，不能按字节数——UTF-8 一个汉字占 3 字节，
            // strlen 会把"清新"算成 6，徽标被撑到 102px 盖住圆环。
            int n = 0;
            for (const char *p = level; *p != '\0'; ++p) {
              if ((*p & 0xC0) != 0x80) n++;
            }
            int w = n * 28 + 24;
            if (w < 84) w = 84;
            lv_obj_set_width(id(status_pill), w);
          }

          snprintf(buf, sizeof(buf), "%.1f°C", temp);
          lv_label_set_text(id(temp_label), buf);
          snprintf(buf, sizeof(buf), "%.0f%%", hum);
          lv_label_set_text(id(hum_label), buf);

          if (sim) {
            lv_obj_clear_flag(id(sim_badge), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(sim_badge), LV_OBJ_FLAG_HIDDEN);
          }

          // ---- 趋势页 ----
          for (int i = 0; i < 16; i++) {
            if (std::isnan(hist[i])) {
              // 没有数据的时段：柱子直接隐藏，不能画成 0 或当前值
              lv_obj_set_height(bars[i], 6);
              lv_obj_set_style_bg_opa(bars[i], LV_OPA_TRANSP, 0);
              continue;
            }
            int h = (int)((hist[i] - 400.0f) * 220.0f / 1400.0f);
            if (h < 6)   h = 6;
            if (h > 220) h = 220;
            lv_obj_set_height(bars[i], h);
            lv_color_t bc, bbg, bbd;
            const char *bn;
            level_of(hist[i], &bc, &bbg, &bbd, &bn);
            lv_obj_set_style_bg_color(bars[i], stale ? gray : bc, 0);
            lv_obj_set_style_bg_opa(bars[i], stale ? LV_OPA_30 : LV_OPA_COVER, 0);
          }

          // ---- 最高 / 平均 / 最低（只统计有数据的格子，少于 2 格不显示）----
          {
            float hmax = NAN, hmin = NAN, hsum = 0;
            int n = 0;
            for (int i = 0; i < 16; i++) {
              if (std::isnan(hist[i])) continue;
              if (n == 0) { hmax = hist[i]; hmin = hist[i]; }
              if (hist[i] > hmax) hmax = hist[i];
              if (hist[i] < hmin) hmin = hist[i];
              hsum += hist[i];
              n++;
            }
            if (n < 2) {
              lv_label_set_text(id(stat_max), "--");
              lv_label_set_text(id(stat_avg), "--");
              lv_label_set_text(id(stat_min), "--");
            } else {
              snprintf(buf, sizeof(buf), "%.0f", hmax);
              lv_label_set_text(id(stat_max), buf);
              snprintf(buf, sizeof(buf), "%.0f", hsum / (float)n);
              lv_label_set_text(id(stat_avg), buf);
              snprintf(buf, sizeof(buf), "%.0f", hmin);
              lv_label_set_text(id(stat_min), buf);
            }
          }

          snprintf(buf, sizeof(buf), "%.0f", co2);
          lv_label_set_text(id(trend_value), buf);
          lv_obj_set_style_text_color(id(trend_value),
                                      lv_color_hex(stale ? 0x9AA5AA : 0xF0F4F6), 0);

          // ---- 右侧胶囊：超时 > 建议通风 > 当前分级 ----
          if (stale) {
            lv_label_set_text(id(trend_state_label), "超时");
            lv_obj_set_width(id(trend_state), 84);
            lv_obj_set_style_text_color(id(trend_state_label), lv_color_hex(0xE5B957), 0);
            lv_obj_set_style_bg_color(id(trend_state), lv_color_hex(0x3D3422), 0);
            lv_obj_set_style_border_color(id(trend_state), lv_color_hex(0x67542B), 0);
          } else if (co2 >= (float)id(g_threshold)) {
            lv_label_set_text(id(trend_state_label), "建议通风");
            lv_obj_set_width(id(trend_state), 160);
            lv_obj_set_style_text_color(id(trend_state_label), lv_color_hex(0xE5B957), 0);
            lv_obj_set_style_bg_color(id(trend_state), lv_color_hex(0x3D3422), 0);
            lv_obj_set_style_border_color(id(trend_state), lv_color_hex(0x67542B), 0);
          } else {
            lv_label_set_text(id(trend_state_label), level);
            lv_obj_set_width(id(trend_state), 80);
            lv_obj_set_style_text_color(id(trend_state_label), c, 0);
            lv_obj_set_style_bg_color(id(trend_state), bg, 0);
            lv_obj_set_style_border_color(id(trend_state), bd, 0);
          }

  # 每分钟往巴法云推一条传感器数据。
  # 巴法云规定 004（传感器）设备的消息格式必须是：
  #   #温度#湿度#开关状态#空气质量#pm2.5#二氧化碳浓度
  # 前面字段不能省，后面可以省，中间可以空但 # 不能少。
  # 注意：往 004 主题发裸数字（比如 "946"）巴法云解析不了，米家同步过去是空设备。
  - interval: 60s
    then:
      # 每分钟刷一次复位原因。主题名故意不带 001~009 后缀，
      # 避免被巴法云当成设备同步到米家（会显示成乱七八糟的温度）。
      - mqtt.publish:
          topic: esp32reset
          payload: !lambda |-
            char buf[8];
            snprintf(buf, sizeof(buf), "%d", (int)esp_reset_reason());
            return std::string(buf);
          retain: true
      # 黑匣子全量历史，同样 retain，重连后随时能读到
      - mqtt.publish:
          topic: esp32boot
          payload: !lambda 'return id(g_boot_log);'
          retain: true
      - if:
          condition:
            lambda: 'return id(co2_sensor).has_state();'
          then:
            - mqtt.publish:
                topic: esp32air004
                payload: !lambda |-
                  char buf[48];
                  snprintf(buf, sizeof(buf), "#%.1f#%.1f#on###%.0f",
                           id(g_temp), id(g_hum), id(g_co2));
                  return std::string(buf);
